# AVX WITHOUT AVX2 (Sandy Bridge class) — the `simd_avx.rs` realization.
#
# Usage:
#   env -u RUSTFLAGS cargo --config .cargo/config-avx.toml <cmd>
#   bash scripts/masking-parity.sh avx-qemu      (runs under qemu -cpu SandyBridge)
#
# Selects the arm `all(target_feature = "avx", not(target_feature = "avx2"))`:
# Sandy Bridge / Ivy Bridge, AMD Bulldozer–Jaguar, VMs that hide AVX2. Plan:
# `.claude/plans/simd-avx1-backend-v1.md`. Overlay semantics as in
# `config-v3.toml`: only the target-cpu is set here; the crypto cfgs come from
# `.cargo/config.toml` through cargo's rustflags join. `env -u RUSTFLAGS` is
# load-bearing for the same reason.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-cpu=sandybridge"]
