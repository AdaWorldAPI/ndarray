# simd-codegen-oracle — proves (or disproves) what actually vectorizes.
#
# Context: `.cargo/config.toml` pins `-Ctarget-cpu=x86-64-v3`, so this crate's
# "scalar polyfill" SIMD storage types (macro-generated `[T; N]`, e.g.
# `avx2_int_type!(U32x16, u32, 16, 0u32)` in `src/simd_avx2.rs`) already
# compile to packed AVX2 via LLVM's loop/SLP vectorizer — they are not scalar
# codegen despite being scalar *source*. This crate is the tested proof of
# that claim, in both directions: probes that DO vectorize (Group A) and
# probes that provably DO NOT (Group B), plus a third bucket (Group C) whose
# classification is the open question being measured (the u64 rotate gap).
#
# EXCLUDED from the workspace (see root Cargo.toml `exclude`) so it has zero
# effect on the default build/test jobs; CI's `simd-codegen-oracle` job
# builds + runs it via --manifest-path, mirroring `neon-simd-parity` /
# `wasm-simd-parity`.
[package]
name = "simd-codegen-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "simd-codegen-oracle"
path = "src/main.rs"

[dependencies]
ndarray = { path = "../..", default-features = false, features = ["std"] }

[profile.release]
debug = false
panic = "abort"
