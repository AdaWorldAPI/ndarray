[package]
name = "splat4d-railway-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Railway-deployed smoke service for the splat4d cascade (A6 worker)"
license = "MIT OR Apache-2.0"

# ── Binary ───────────────────────────────────────────────────────────────────
[[bin]]
name = "splat4d-railway-smoke"
path = "src/main.rs"

# ── Features ─────────────────────────────────────────────────────────────────
[features]
default = []
# Opt-in NARS-revision composition path (off by default per forbidden
# constraint #5; W7 closure-swap sprint will flip this for the cognitive
# interpretation).  Must be declared here so `ndarray`'s `splat4d-nars-compose`
# feature is activated transitively when this crate's feature is on.
splat4d-nars-compose = ["ndarray/splat4d-nars-compose"]

# ── Dependencies ─────────────────────────────────────────────────────────────
[dependencies]

# Core workspace dep — pulls in splat4d::cascade::frame_pipeline
ndarray = { workspace = true, features = ["std", "splat3d"] }

# Async HTTP server (axum 0.7 requires tokio 1.x)
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }

# Async runtime
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net"] }

# Prometheus metrics exposition
# prometheus 0.13 is stable on Rust 1.95; prometheus-client (0.22) is an
# alternative but prometheus 0.13 has wider ecosystem support on Railway.
prometheus = { version = "0.13", default-features = false }

# Tower middleware for axum (needed for ServiceBuilder composition)
tower = { version = "0.4", default-features = false, features = ["util"] }

# ── Dev-dependencies ─────────────────────────────────────────────────────────
[dev-dependencies]
# No additional dev-deps beyond workspace defaults for the smoke skeleton.

# ── Profile overrides ────────────────────────────────────────────────────────
[profile.release]
# LTO + single codegen unit for Railway hobby-tier binary size and startup.
# These settings are inherited from the workspace root profile; override here
# only if the smoke binary has specific needs.
# lto = true
# codegen-units = 1
